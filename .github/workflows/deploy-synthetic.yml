name: Deploy reviewed synthetic Common Ground

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: common-ground-synthetic-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check out the approved application snapshot
        uses: actions/checkout@v6
        with:
          ref: 9efbd77b76c489dfe762a1ac03fd2ed32589192d
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          package-manager-cache: false

      - name: Verify synthetic configuration
        working-directory: project
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const config=JSON.parse(readFileSync('wrangler.jsonc','utf8'));
          assert.equal(config.name,'common-ground-qloo');
          for(const key of ['QLOO_LIVE_ENABLED','QLOO_CONTRACT_VERIFIED','QLOO_BUDGET_VERIFIED']) assert.equal(config.vars[key],'false');
          for(const key of ['QLOO_MINUTE_LIMIT','QLOO_DAILY_LIMIT','QLOO_EVENT_LIMIT']) assert.equal(config.vars[key],'0');
          assert.equal(config.vars.QLOO_API_KEY,undefined);
          NODE

      - name: Run the complete local test suite
        working-directory: project
        run: npm test

      - name: Resolve isolated deployment tooling with patched Undici
        run: |
          mkdir -p "$RUNNER_TEMP/qloo-tooling"
          cat > "$RUNNER_TEMP/qloo-tooling/package.json" <<'JSON'
          {"private":true,"dependencies":{"wrangler":"4.152.0"},"overrides":{"undici":"7.30.1"}}
          JSON
          npm install --prefix "$RUNNER_TEMP/qloo-tooling" --package-lock-only --ignore-scripts --no-fund

      - name: Audit the toolchain before installing or providing credentials
        run: npm audit --prefix "$RUNNER_TEMP/qloo-tooling" --json --audit-level=high

      - name: Install the audited lockfile without lifecycle scripts
        run: npm ci --prefix "$RUNNER_TEMP/qloo-tooling" --ignore-scripts --no-fund

      - name: Verify the actual Worker bundle without uploading
        run: '"$RUNNER_TEMP/qloo-tooling/node_modules/.bin/wrangler" deploy --cwd project --dry-run --outdir "$RUNNER_TEMP/qloo-worker-bundle"'

      - name: Deploy synthetic app on the existing Free account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 6cc80f0a98f39f64f0ea539f6cd267bd
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::CLOUDFLARE_API_TOKEN is missing from this repository Actions secret.'
            exit 1
          fi
          "$RUNNER_TEMP/qloo-tooling/node_modules/.bin/wrangler" deploy --cwd project
